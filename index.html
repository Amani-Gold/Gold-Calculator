<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gold Calculator — Amani Alderazi</title>

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  margin:0;
  background:#f6f7fb;
  color:#111
}

.wrap{
  max-width:900px;
  margin:24px auto;
  padding:16px
}

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 6px 18px rgba(0,0,0,.05)
}

h1{
  margin:0 0 10px;
  font-size:20px
}

.tabs{
  display:flex;
  gap:10px;
  margin:14px 0;
  flex-wrap:wrap
}

.tab{
  border:1px solid #ddd;
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  background:#fff
}

.tab.active{
  background:#111;
  color:#fff
}

.panel{display:none}
.panel.active{display:block}

label{
  display:block;
  margin:10px 0 6px;
  font-size:13px
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px
}

.row{
  display:grid;
  gap:12px
}

@media(min-width:760px){
  .row{grid-template-columns:1fr 1fr 1fr}
}

.result{
  margin-top:16px;
  padding:14px;
  border-radius:12px;
  background:#f4f6ff
}

.result div{
  display:flex;
  justify-content:space-between;
  padding:6px 0
}

.big{
  font-weight:800;
  font-size:20px
}

.btns{
  display:flex;
  gap:10px;
  margin-top:12px
}

button{
  padding:10px 14px;
  border-radius:10px;
  border:0;
  cursor:pointer
}

.primary{background:#111;color:#fff}
.ghost{background:#fff;border:1px solid #ddd}

/* Social */
.social{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.social a{
  display:flex;
  align-items:center;
  gap:8px;
  background:#111;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  text-decoration:none
}

.social svg{
  width:18px;
  height:18px
}

.footer{
  margin-top:18px;
  font-size:13px;
  color:#666
}

.lang{
  font-size:12px;
  color:#888
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>حاسبة الذهب | Gold Calculator</h1>

<div class="tabs">
  <button class="tab active" onclick="showTab(1)">
    حساب السعر النهائي<br><span class="lang">Final Price</span>
  </button>
  <button class="tab" onclick="showTab(2)">
    استخراج المصنعية<br><span class="lang">Manufacture Extraction</span>
  </button>
</div>

<!-- TAB 1 -->
<div class="panel active" id="tab1">

<div class="row">
  <div>
    <label>الوزن (غرام)<br><span class="lang">Weight (g)</span></label>
    <input id="g1" type="number">
  </div>

  <div>
    <label>المصنعية لكل غرام<br><span class="lang">Manufacture / gram</span></label>
    <input id="m1" type="number">
  </div>

  <div>
    <label>سعر الذهب اليوم<br><span class="lang">Gold price / gram</span></label>
    <input id="p1" type="number">
  </div>
</div>

<div class="result">
  <div><span>بدون ضريبة | No VAT</span><strong id="noVat1">—</strong> BHD</div>
  <div><span>الضريبة | VAT</span><strong id="vat1">—</strong> BHD</div>
  <div class="big"><span>السعر النهائي | Final</span><strong id="final1">—</strong> BHD</div>
</div>

<div class="btns">
  <button class="primary" onclick="copy1()">Copy</button>
  <button class="ghost" onclick="reset1()">Reset</button>
</div>

</div>

<!-- TAB 2 -->
<div class="panel" id="tab2">

<div class="row">
  <div>
    <label>السعر النهائي<br><span class="lang">Final price</span></label>
    <input id="final2" type="number">
  </div>

  <div>
    <label>الوزن (غرام)<br><span class="lang">Weight</span></label>
    <input id="g2" type="number">
  </div>

  <div>
    <label>سعر الذهب اليوم<br><span class="lang">Gold price</span></label>
    <input id="p2" type="number">
  </div>
</div>

<div class="result">
  <div><span>بدون ضريبة | No VAT</span><strong id="noVat2">—</strong></div>
  <div><span>سعر الذهب بدون مصنعية | Gold only</span><strong id="goldNoManu2">—</strong></div>
  <div class="big">
    <span>المصنعية لكل غرام | Manufacture</span>
    <strong id="manu2">—</strong> BHD
  </div>
</div>

<div class="btns">
  <button class="primary" onclick="copy2()">Copy</button>
  <button class="ghost" onclick="reset2()">Reset</button>
</div>

</div>

<!-- FOOTER -->
<div class="footer">
إعداد: <strong>Amani Alderazi</strong>

<div class="social">

<a href="https://www.snapchat.com/add/dramani_photo" target="_blank">
👻 Snapchat
</a>

<a href="https://www.tiktok.com/@dr.amani92" target="_blank">
🎵 TikTok
</a>

<a href="https://www.instagram.com/amani_photo" target="_blank">
📸 Instagram
</a>

</div>
</div>

</div>
</div>

<script>
function showTab(n){
  document.getElementById("tab1").classList.remove("active");
  document.getElementById("tab2").classList.remove("active");
  document.querySelectorAll(".tab")[0].classList.remove("active");
  document.querySelectorAll(".tab")[1].classList.remove("active");
  document.getElementById("tab"+n).classList.add("active");
  document.querySelectorAll(".tab")[n-1].classList.add("active");
}

function f(n){
  return Number(n).toLocaleString("en-US",{minimumFractionDigits:2})
}

function calc1(){
  if(!g1.value || !m1.value || !p1.value) return;
  let noVat=(g1.value*m1.value)+(g1.value*p1.value);
  let final=noVat*1.1;
  noVat1.textContent=f(noVat);
  vat1.textContent=f(final-noVat);
  final1.textContent=f(final);
}

function calc2(){
  if(!final2.value || !g2.value || !p2.value) return;
  let noVat=final2.value/1.1;
  let gold=p2.value*g2.value;
  let manu=(noVat-gold)/g2.value;
  noVat2.textContent=f(noVat);
  goldNoManu2.textContent=f(gold);
  manu2.textContent=f(manu);
}

[g1,m1,p1].forEach(i=>i.addEventListener("input",calc1));
[final2,g2,p2].forEach(i=>i.addEventListener("input",calc2));

function reset1(){g1.value=m1.value=p1.value="";noVat1.textContent=vat1.textContent=final1.textContent="—";}
function reset2(){final2.value=g2.value=p2.value="";noVat2.textContent=goldNoManu2.textContent=manu2.textContent="—";}

function copy1(){
  navigator.clipboard.writeText(`Final price: ${final1.textContent} BHD`);
  alert("Copied");
}

function copy2(){
  navigator.clipboard.writeText(`Manufacture: ${manu2.textContent} BHD`);
  alert("Copied");
}
</script>

</body>
</html>
